# Runs the whitelisted test split (environments/benchmark_test_whitelist.json).
# The test tasks share ids with benchmark.json, so select the test file:
#   SUBTASK_BENCHMARK_FILE=benchmark_test.json python scripts/run_eval.py scripts/eval_configs/test_split.yaml
# Add LLM_USAGE_LOG=<file>.jsonl to record token use and task times, then turn
# the log into CSVs with scripts/usage_report.py.
run_name: test_split_opus55

runner:
  threads: 8
  output_dir: ./eval_outputs
  seed: 17
  timeout_secs: 1800

model_configs:
  opus55:
    # Claude Opus 5.5. Reasoning tokens count toward max_tokens, so leave room.
    provider: anthropic
    name: claude-opus-5-5
    max_tokens: 32000
    # Opus 5.5 defaults to medium effort; ask for max. Sent through extra_body because anthropic==0.40.0 has no output_config argument.
    extra_body: {output_config: {effort: max}}
    timeout: 600

agents:
  run1:
    # sva_v4_note: SVA V4 without written-out reasoning. Claude Opus 5.5
    # declines the original sva_v4 prompt.
    name: sva_v4_note
    model_config_name: opus55

benchmarks:
  subtaskbench:
    dataset: subtaskbench_test
    max_examples: -1
    max_steps: 20
    headless: true
    reset_env: false
    viewport_size:
      width: 1280
      height: 720
